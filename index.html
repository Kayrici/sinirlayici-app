<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dil Öğrenme - Emsile 24 Sîga Kelime Eşleştirme Oyunu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: rgba(26, 34, 53, 0.7);
      --bg-card-hover: rgba(35, 46, 70, 0.9);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-primary: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;
      --font-arabic: 'Amiri', 'Traditional Arabic', 'Scheherazade New', Tahoma, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 350px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(168, 85, 247, 0.08) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header.game-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25));
      border: 1px solid rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }

    .brand-texts h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-texts p {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-header.primary {
      background: rgba(99, 102, 241, 0.18);
      border-color: rgba(99, 102, 241, 0.45);
      color: #a5b4fc;
    }

    .btn-header.primary:hover {
      background: rgba(99, 102, 241, 0.35);
      color: #fff;
    }

    /* Main Container */
    main.game-container {
      position: relative;
      z-index: 10;
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 40px;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================ */
    /* 1. QUIZ BÖLÜMÜ                                               */
    /* ============================================================ */
    #quizSection {
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.25s ease-out;
      max-width: 540px;
      margin: 0 auto;
      width: 100%;
    }

    .quiz-tracker-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .tracker-pill {
      font-size: 0.78rem;
      font-weight: 700;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .sound-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 8px;
    }

    /* Soru Kartı */
    .target-word-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 30px 20px 26px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .target-word-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    }

    .word-badge-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      display: inline-block;
    }

    .target-word-title {
      font-family: var(--font-arabic);
      font-size: 3.2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin: 6px 0 12px 0;
      text-shadow: 0 2px 18px rgba(99, 102, 241, 0.5);
      direction: rtl;
    }

    .target-word-instruction {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* 5 Seçenek Butonları */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      transition: all 0.16s ease;
      min-height: 54px;
      position: relative;
    }

    .option-btn:hover {
      background: var(--bg-card-hover);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-letter {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 800;
      color: #a5b4fc;
      flex-shrink: 0;
    }

    .option-text {
      flex: 1;
      word-break: break-word;
      line-height: 1.3;
    }

    /* Seçenek Animasyonları */
    .option-btn.correct-choice {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(5, 150, 105, 0.45)) !important;
      border-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.6) !important;
      transform: scale(1.02);
      animation: pulseGreen 0.35s ease;
    }

    .option-btn.wrong-choice {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.4), rgba(185, 28, 28, 0.45)) !important;
      border-color: #ef4444 !important;
      color: #ffffff !important;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6) !important;
      animation: shakeRed 0.4s ease;
    }

    @keyframes pulseGreen {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1.02); }
    }

    @keyframes shakeRed {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* ============================================================ */
    /* 2. 24 KELİME 3D FLASHCARD TABLOSU (SAĞDAN SOLA, 5-5-4-5-5)    */
    /* ============================================================ */
    #tableSection {
      display: none;
      flex-direction: column;
      animation: fadeIn 0.25s ease-out;
      width: 100%;
    }

    .table-banner {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .table-banner-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .table-banner-icon {
      font-size: 1.8rem;
      filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.4));
    }

    .table-banner-info h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 2px;
    }

    .table-banner-info p {
      font-size: 0.74rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    .btn-continue {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.16s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-continue:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }

    .btn-continue:active {
      transform: scale(0.96);
    }

    .btn-continue.bottom-full {
      width: 100%;
      padding: 15px;
      font-size: 0.98rem;
      justify-content: center;
      margin-top: 18px;
    }

    /* 5 SATIR KAPSAYICISI (SAĞDAN SOLA DİZİLİŞ) */
    .emsile-table-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .emsile-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px;
      direction: rtl;
    }

    .emsile-row-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .emsile-row {
      display: grid;
      direction: rtl; /* SAĞDAN SOLA DİZİLİŞ */
      gap: 8px;
      width: 100%;
    }

    /* 5 KELİMEYİ EŞİT DAĞITAN SATIR (1., 2., 4., 5. Satırlar) */
    .emsile-row.cols-5 {
      grid-template-columns: repeat(5, 1fr);
      width: 100%;
      margin: 0;
    }

    /* 4 KELİMEYİ SAĞA YAPIŞTIRAN SATIR (3. Satır: 11..14) - KULLANICI İSTEĞİ */
    /* 5 sütunluk ızgarada ilk 4 sütuna yerleşir, sol sütun boş kalır -> Sağa yapışık! */
    .emsile-row.cols-4 {
      grid-template-columns: repeat(5, 1fr);
      width: 100%;
      margin: 0;
    }

    /* ZAMİR TABLOSU 3 SÜTUNLU SATIRLAR (Gâib, Gâibe, Muhâtap, Muhâtaba) */
    .emsile-row.cols-3 {
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
      margin: 0;
    }

    /* ZAMİR TABLOSU 5. SATIR (Mütekellim: Ben tek sütun, Biz orta ve solu kaplasın) */
    .emsile-row.zamir-row-5 {
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
      margin: 0;
    }

    .emsile-row.zamir-row-5 .card-span-2 {
      grid-column: span 2;
    }

    @media (max-width: 540px) {
      .emsile-row {
        gap: 6px;
      }
    }

    /* Mod Seçici Tab Bar */
    .mode-tabs-wrapper {
      width: 100%;
      max-width: 540px;
      margin: 10px auto 4px auto;
      padding: 0 16px;
      display: flex;
      justify-content: center;
    }

    .mode-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 4px;
      gap: 6px;
      width: 100%;
    }

    .mode-tab {
      flex: 1;
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .mode-tab.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .zamir-layout-toggle-bar {
      display: none;
      justify-content: center;
      margin-bottom: 12px;
    }

    .btn-zamir-toggle {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-zamir-toggle:hover {
      background: rgba(99, 102, 241, 0.28);
      color: #fff;
    }

    /* 3D Flip Card Container */
    .flip-card {
      perspective: 1000px;
      -webkit-perspective: 1000px;
      height: 94px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      border-radius: 12px;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Ön Yüz: Arapça Kelime */
    .flip-card-front {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .card-id-tag {
      position: absolute;
      top: 4px;
      right: 6px; /* Sağdan sola olduğu için sağ üst köşe */
      font-size: 0.62rem;
      font-weight: 700;
      color: #94a3b8;
      opacity: 0.85;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .card-word-text {
      font-family: var(--font-arabic);
      font-size: 1.38rem;
      font-weight: 700;
      color: #ffffff;
      word-break: keep-all;
      line-height: 1.25;
      direction: rtl;
    }

    @media (max-width: 420px) {
      .card-word-text {
        font-size: 1.2rem;
      }
      .flip-card {
        height: 86px;
      }
    }

    .card-flip-hint {
      font-size: 0.6rem;
      color: #a5b4fc;
      margin-top: 3px;
      font-weight: 600;
    }

    /* Yanlış bilinen kelimeyi parlat */
    .flip-card.missed-highlight .flip-card-front {
      border: 2px solid #ef4444;
      background: rgba(239, 68, 68, 0.22);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.7);
      animation: glowRed 1.4s infinite alternate;
    }

    @keyframes glowRed {
      0% { box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }
      100% { box-shadow: 0 0 22px rgba(239, 68, 68, 0.95); }
    }

    /* Arka Yüz: Anlamı */
    .flip-card-back {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: 1px solid rgba(52, 211, 153, 0.7);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      direction: ltr; /* Türkçe anlamlar soldan sağa */
    }

    .card-meaning-text {
      font-size: 0.76rem;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
      line-height: 1.25;
      padding: 0 2px;
    }

    .card-meaning-tag {
      font-size: 0.58rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 5px;
      border-radius: 5px;
      margin-top: 4px;
    }

    /* ============================================================ */
    /* MODAL: KELİMELERİ DÜZENLE                                    */
    /* ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      animation: modalScale 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .btn-close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    .btn-modal-save {
      flex: 1;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-modal-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .word-edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .word-edit-num {
      width: 24px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: right;
    }

    .word-edit-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }

    .word-edit-input.arabic-input {
      font-family: var(--font-arabic);
      font-size: 1.15rem;
      direction: rtl;
    }

    .word-edit-input:focus {
      border-color: #818cf8;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Toast */
    #toastMessage {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    #toastMessage.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Üst Bar -->
  <header class="game-header">
    <div class="header-brand">
      <div class="brand-icon-box" id="headerBrandIcon">📖</div>
      <div class="brand-texts">
        <h1 id="headerMainTitle">Emsile-i Muhtelife</h1>
        <p id="headerSubTitle">24 Sîga Kelime Eşleştirme</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-header" onclick="openEditWordsModal()" title="Kelimeleri Düzenle">
        ✏️ Düzenle
      </button>
      <button type="button" class="btn-header primary" id="btnToggleTable" onclick="toggleTableDirectly()">
        📚 Tablo
      </button>
    </div>
  </header>

  <!-- MOD SEÇİCİ TAB BAR (Emsile 24 Sîga & Zamir Tablosu 14 Zamir) -->
  <div class="mode-tabs-wrapper">
    <div class="mode-tabs">
      <button type="button" class="mode-tab active" id="btnModeEmsile" onclick="setGameMode('emsile')">
        📖 Emsile (24 Sîga)
      </button>
      <button type="button" class="mode-tab" id="btnModeZamir" onclick="setGameMode('zamir')">
        👤 Zamirler (14 Zamir)
      </button>
    </div>
  </div>

  <!-- Ana Oyun Kapsayıcısı -->
  <main class="game-container">

    <!-- 1. BÖLÜM: QUIZ (5 ŞIKLI TEST) -->
    <section id="quizSection">
      <div class="quiz-tracker-bar">
        <span class="tracker-pill" id="quizTrackerText">Kelime 1 / 24</span>
        <button type="button" class="sound-toggle-btn" id="soundToggleBtn" onclick="toggleSound()" title="Ses Aç/Kapat">
          🔊
        </button>
      </div>

      <!-- Soru Kartı -->
      <div class="target-word-card">
        <span class="word-badge-tag" id="targetBadgeTag">HEDEF KELİME</span>
        <h2 class="target-word-title" id="targetWordText">نَصَرَ</h2>
        <p class="target-word-instruction">Aşağıdaki 5 seçenekten doğru Türkçe karşılığını seçin:</p>
      </div>

      <!-- 5 Şıklı Seçenekler Grid -->
      <div class="options-grid" id="optionsGrid">
        <!-- JS ile dinamik doldurulur -->
      </div>
    </section>

    <!-- 2. BÖLÜM: 3D FLASHCARD TABLOSU (SAĞDAN SOLA) -->
    <section id="tableSection">
      <div class="table-banner">
        <div class="table-banner-left">
          <div class="table-banner-icon" id="tableBannerIcon">📚</div>
          <div class="table-banner-info">
            <h3 id="tableBannerTitle">24 Sîga Tablosu (Sağdan Sola)</h3>
            <p id="tableBannerDesc">Anlamını görmek istediğiniz karta dokunun, kart ters dönecektir.</p>
          </div>
        </div>
        <button type="button" class="btn-continue" onclick="continueQuiz()">
          <span>🎮 Devam Et ▶️</span>
        </button>
      </div>

      <!-- Zamir tablosu son satır düzeni hızlı değiştirici (Kullanıcı İsteği) -->
      <div class="zamir-layout-toggle-bar" id="zamirLayoutBar">
        <button type="button" class="btn-zamir-toggle" id="btnToggleZamirLayout" onclick="toggleZamirLayout()">
          🔄 Son Satır: Ben (Sağda) | Biz (Sol + Orta Kaplar)
        </button>
      </div>

      <!-- SATIRLAR KAPSAYICISI -->
      <div class="emsile-table-wrapper" id="emsileRowsWrapper">
        <!-- JS ile dinamik satırlar basılır -->
      </div>

      <button type="button" class="btn-continue bottom-full" onclick="continueQuiz()">
        <span>🎮 Oyuna Devam Et ▶️</span>
      </button>
    </section>

  </main>

  <!-- KELİMELERİ DÜZENLE MODALI -->
  <div class="modal-overlay" id="editWordsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>✏️ 24 Kelime ve Anlamlarını Düzenle</h3>
        <button type="button" class="btn-close-modal" onclick="closeEditWordsModal()">✕</button>
      </div>
      <div class="modal-body" id="editWordsListContainer">
        <!-- 24 satır input buraya doldurulur -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel" onclick="closeEditWordsModal()">İptal</button>
        <button type="button" class="btn-modal-save" onclick="saveEditedWords()">Kaydet ve Uygula</button>
      </div>
    </div>
  </div>

  <div id="toastMessage"></div>

  <script>
    // 1. KELİME LİSTESİ: EMSİLE-İ MUHTELİFE (24 Sîga)
    // NOT: Kullanıcı isteği doğrultusunda baştaki 'fehüve', 've zâke' gibi ekler kaldırılmıştır.
    const EMSILE_24_WORDS = [
      // 1. SATIR (5 Kelime - Sağdan Sola)
      { id: 1, word: "نَصَرَ", meaning: "Mâzi fiil", row: 1 },
      { id: 2, word: "يَنْصُرُ", meaning: "Müzâri' fiil", row: 1 },
      { id: 3, word: "نَصْرًا", meaning: "Mastar", row: 1 },
      { id: 4, word: "نَاصِرٌ", meaning: "İsm-i fâil", row: 1 },
      { id: 5, word: "مَنْصُورٌ", meaning: "İsm-i mef'ûl", row: 1 },

      // 2. SATIR (5 Kelime - Sağdan Sola)
      { id: 6, word: "لَمْ يَنْصُرْ", meaning: "Cahd-ı mutlak", row: 2 },
      { id: 7, word: "لَمَّا يَنْصُرْ", meaning: "Cahd-ı müstağrak", row: 2 },
      { id: 8, word: "مَا يَنْصُرُ", meaning: "Nefy-i hâl", row: 2 },
      { id: 9, word: "لَا يَنْصُرُ", meaning: "Nefy-i istikbâl", row: 2 },
      { id: 10, word: "لَنْ يَنْصَرَ", meaning: "Te'kîd-i nefy-i istikbâl", row: 2 },

      // 3. SATIR (4 Kelime - Sağdan Sola)
      { id: 11, word: "لِيَنْصُرْ", meaning: "Emr-i gâib", row: 3 },
      { id: 12, word: "لَا يَنْصُرْ", meaning: "Nehy-i gâib", row: 3 },
      { id: 13, word: "أُنْصُرْ", meaning: "Emr-i hâzır", row: 3 },
      { id: 14, word: "لَا تَنْصُرْ", meaning: "Nehy-i hâzır", row: 3 },

      // 4. SATIR (5 Kelime - Sağdan Sola)
      { id: 15, word: "مَنْصَرٌ", meaning: "İsm-i zaman, ism-i mekân, masdar-ı mimi", row: 4 },
      { id: 16, word: "مِنْصَرٌ", meaning: "İsm-i âlet", row: 4 },
      { id: 17, word: "نَصْرَةً", meaning: "Masdar-ı binâ-i merre", row: 4 },
      { id: 18, word: "نِصْرَةً", meaning: "Masdar-ı binâ-i nev'", row: 4 },
      { id: 19, word: "نُصَيْرٌ", meaning: "İsm-i tasgîr", row: 4 },

      // 5. SATIR (5 Kelime - Sağdan Sola)
      { id: 20, word: "نَصْرِيٌّ", meaning: "İsm-i mensûb", row: 5 },
      { id: 21, word: "نَصَّارٌ", meaning: "Mübalağalı ism-i fâil", row: 5 },
      { id: 22, word: "أَنْصَرُ", meaning: "İsm-i tafdîl", row: 5 },
      { id: 23, word: "مَا أَنْصَرَهُ", meaning: "Fiil-i taaccüb-i evvel", row: 5 },
      { id: 24, word: "أَنْصِرْ بِهِ", meaning: "Fiil-i taaccüb-i sânî", row: 5 }
    ];

    // 2. KELİME LİSTESİ: ZAMİR TABLOSU (14 Zamir - Munfasıl Şahıs Zamirleri)
    const ZAMIR_14_WORDS = [
      // 1. SATIR: Gâib (3 Zamir - Sağdan Sola: Hüve, Hümâ, Hüm)
      { id: 1, word: "هُوَ", meaning: "Gâib (Tekil Erkek / O)", row: 1 },
      { id: 2, word: "هُمَا", meaning: "Gâib (İkil Erkek / O ikisi)", row: 1 },
      { id: 3, word: "هُمْ", meaning: "Gâib (Çoğul Erkek / Onlar)", row: 1 },

      // 2. SATIR: Gâibe (3 Zamir - Sağdan Sola: Hiye, Hümâ, Hünne)
      { id: 4, word: "هِيَ", meaning: "Gâibe (Tekil Kadın / O)", row: 2 },
      { id: 5, word: "هُمَا", meaning: "Gâibe (İkil Kadın / O ikisi)", row: 2 },
      { id: 6, word: "هُنَّ", meaning: "Gâibe (Çoğul Kadın / Onlar)", row: 2 },

      // 3. SATIR: Muhâtap (3 Zamir - Sağdan Sola: Ente, Entümâ, Entüm)
      { id: 7, word: "أَنْتَ", meaning: "Muhâtap (Tekil Erkek / Sen)", row: 3 },
      { id: 8, word: "أَنْتُمَا", meaning: "Muhâtap (İkil Erkek / Siz ikiniz)", row: 3 },
      { id: 9, word: "أَنْتُمْ", meaning: "Muhâtap (Çoğul Erkek / Sizler)", row: 3 },

      // 4. SATIR: Muhâtaba (3 Zamir - Sağdan Sola: Enti, Entümâ, Entünne)
      { id: 10, word: "أَنْتِ", meaning: "Muhâtaba (Tekil Kadın / Sen)", row: 4 },
      { id: 11, word: "أَنْتُمَا", meaning: "Muhâtaba (İkil Kadın / Siz ikiniz)", row: 4 },
      { id: 12, word: "أَنْتُنَّ", meaning: "Muhâtaba (Çoğul Kadın / Sizler)", row: 4 },

      // 5. SATIR: Mütekellim (Sonda 2 Zamir: Ben tekil, Biz ikil ve çoğul)
      { id: 13, word: "أَنَا", meaning: "Mütekellim (Tekil / Ben)", row: 5 },
      { id: 14, word: "نَحْنُ", meaning: "Mütekellim (İkil ve Çoğul / Biz)", row: 5 }
    ];

    // 3. SES SENTEZLEYİCİSİ (Web Audio API - %100 Çevrimdışı)
    let isSoundMuted = false;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (isSoundMuted) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.14); // A5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(now + 0.2);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(130, now + 0.24);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(now + 0.24);
        } else if (type === 'flip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(540, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(now + 0.08);
        }
      } catch(e) {}
    }

    function toggleSound() {
      isSoundMuted = !isSoundMuted;
      const btn = document.getElementById("soundToggleBtn");
      if (btn) btn.textContent = isSoundMuted ? "🔇" : "🔊";
      showToast(isSoundMuted ? "Ses kapatıldı" : "Ses açıldı");
    }

    // 4. OYUN YÖNETİCİSİ VE MOD YÖNETİMİ
    let currentMode = 'emsile'; // 'emsile' | 'zamir'
    let zamirLayout = 'ben_right_biz_left'; // 'ben_right_biz_left' (Ben Sağda, Biz Sol+Orta) | 'ben_left_biz_right' (Ben Solda, Biz Sağ+Orta)
    let emsileWords = EMSILE_24_WORDS.slice();
    let zamirWords = ZAMIR_14_WORDS.slice();
    let words = emsileWords;
    let shuffledIndices = [];
    let currentOrderIndex = 0;
    let currentWord = null;
    let isAnswering = false;
    let lastMissedWordId = null;

    function loadCustomWords() {
      try {
        localStorage.removeItem("sinirlayici_custom_lang_words_v1");
        localStorage.removeItem("sinirlayici_custom_lang_words_v2");
        localStorage.removeItem("sinirlayici_custom_lang_words_v3");

        // Emsile Kelimeleri
        const rawEmsile = localStorage.getItem("sinirlayici_custom_lang_words_v4");
        if (rawEmsile) {
          const parsed = JSON.parse(rawEmsile);
          if (Array.isArray(parsed) && parsed.length === 24) {
            emsileWords = parsed;
          }
        }

        // Zamir Kelimeleri
        const rawZamir = localStorage.getItem("sinirlayici_custom_zamir_words_v1");
        if (rawZamir) {
          const parsedZamir = JSON.parse(rawZamir);
          if (Array.isArray(parsedZamir) && parsedZamir.length === 14) {
            zamirWords = parsedZamir;
          }
        }

        const savedLayout = localStorage.getItem("sinirlayici_zamir_layout_pref");
        if (savedLayout) zamirLayout = savedLayout;
      } catch(e) {}
      words = (currentMode === 'emsile' ? emsileWords : zamirWords);
    }

    function setGameMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      const tabEmsile = document.getElementById("btnModeEmsile");
      const tabZamir = document.getElementById("btnModeZamir");
      const brandIcon = document.getElementById("headerBrandIcon");
      const mainTitle = document.getElementById("headerMainTitle");
      const subTitle = document.getElementById("headerSubTitle");
      const bannerIcon = document.getElementById("tableBannerIcon");
      const bannerTitle = document.getElementById("tableBannerTitle");
      const bannerDesc = document.getElementById("tableBannerDesc");
      const zamirBar = document.getElementById("zamirLayoutBar");

      if (mode === 'emsile') {
        if (tabEmsile) tabEmsile.classList.add("active");
        if (tabZamir) tabZamir.classList.remove("active");
        if (brandIcon) brandIcon.textContent = "📖";
        if (mainTitle) mainTitle.textContent = "Emsile-i Muhtelife";
        if (subTitle) subTitle.textContent = "24 Sîga Kelime Eşleştirme";
        if (bannerIcon) bannerIcon.textContent = "📚";
        if (bannerTitle) bannerTitle.textContent = "24 Sîga Tablosu (Sağdan Sola)";
        if (bannerDesc) bannerDesc.textContent = "3. Satırdaki 4 kelime sağa yapışıktır (11-14).";
        if (zamirBar) zamirBar.style.display = "none";
        words = emsileWords;
      } else {
        if (tabEmsile) tabEmsile.classList.remove("active");
        if (tabZamir) tabZamir.classList.add("active");
        if (brandIcon) brandIcon.textContent = "👤";
        if (mainTitle) mainTitle.textContent = "Zamir Tablosu";
        if (subTitle) subTitle.textContent = "14 Şahıs Zamiri Eşleştirme";
        if (bannerIcon) bannerIcon.textContent = "👤";
        if (bannerTitle) bannerTitle.textContent = "14 Zamir Tablosu (Sağdan Sola)";
        if (bannerDesc) bannerDesc.textContent = "Son satırda 'Ben' tek sütun, 'Biz' iki sütunu (orta ve sol) kaplar.";
        if (zamirBar) zamirBar.style.display = "flex";
        words = zamirWords;
        updateZamirToggleButtonText();
      }

      initShuffledIndices();
      renderQuestion();
      showToast(mode === 'emsile' ? "📖 Emsile Modu Açıldı" : "👤 Zamir Tablosu Modu Açıldı");
    }

    function toggleZamirLayout() {
      zamirLayout = (zamirLayout === 'ben_right_biz_left' ? 'ben_left_biz_right' : 'ben_right_biz_left');
      try {
        localStorage.setItem("sinirlayici_zamir_layout_pref", zamirLayout);
      } catch(e) {}
      updateZamirToggleButtonText();
      render24Cards(null);
      showToast(zamirLayout === 'ben_right_biz_left' 
        ? "Düzen: Ben Sağda | Biz Sol ve Ortayı Kaplar" 
        : "Düzen: Ben Solda Yapışık | Biz Sağ ve Ortayı Kaplar");
    }

    function updateZamirToggleButtonText() {
      const btn = document.getElementById("btnToggleZamirLayout");
      if (!btn) return;
      if (zamirLayout === 'ben_right_biz_left') {
        btn.textContent = "🔄 Son Satır: Ben (Sağda) | Biz (Sol + Orta Kaplar)";
      } else {
        btn.textContent = "🔄 Son Satır: Ben (Solda Yapışık) | Biz (Sağ + Orta)";
      }
    }

    function initShuffledIndices() {
      shuffledIndices = [];
      for (let i = 0; i < words.length; i++) shuffledIndices.push(i);
      for (let i = shuffledIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
      }
      currentOrderIndex = 0;
    }

    function renderQuestion() {
      if (shuffledIndices.length === 0) initShuffledIndices();
      isAnswering = false;

      const targetIdx = shuffledIndices[currentOrderIndex];
      currentWord = words[targetIdx];

      // Başlık ve Sayaç
      const targetWordEl = document.getElementById("targetWordText");
      const trackerEl = document.getElementById("quizTrackerText");
      if (targetWordEl) targetWordEl.textContent = currentWord.word;
      if (trackerEl) trackerEl.textContent = `Soru ${currentOrderIndex + 1} / ${words.length}`;

      // 5 Seçenek Oluştur (1 Doğru, 4 Çeldirici)
      const distractors = words
        .filter(w => w.id !== currentWord.id)
        .map(w => w.meaning);

      for (let i = distractors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [distractors[i], distractors[j]] = [distractors[j], distractors[i]];
      }
      const chosenDistractors = distractors.slice(0, 4);

      const choices = [currentWord.meaning, ...chosenDistractors];
      for (let i = choices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [choices[i], choices[j]] = [choices[j], choices[i]];
      }

      const grid = document.getElementById("optionsGrid");
      if (grid) {
        grid.innerHTML = "";
        const letters = ["A", "B", "C", "D", "E"];
        choices.forEach((choice, idx) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.setAttribute("type", "button");
          btn.innerHTML = `
            <span class="option-letter">${letters[idx]}</span>
            <span class="option-text">${escapeHtml(choice)}</span>
          `;
          btn.addEventListener("click", () => handleAnswer(choice, btn));
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(selectedMeaning, clickedBtn) {
      if (isAnswering) return;
      isAnswering = true;

      const isCorrect = (selectedMeaning === currentWord.meaning);

      if (isCorrect) {
        // DOĞRU CEVAP
        clickedBtn.classList.add("correct-choice");
        playSound('correct');
        if (navigator.vibrate) navigator.vibrate(35);

        // İstatistik tutulmaz; doğrudan bir sonraki soruya geçilir
        setTimeout(() => {
          currentOrderIndex = (currentOrderIndex + 1) % words.length;
          renderQuestion();
        }, 400);
      } else {
        // YANLIŞ CEVAP
        clickedBtn.classList.add("wrong-choice");
        playSound('wrong');
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

        // Doğru şıkkı yeşille göster
        const grid = document.getElementById("optionsGrid");
        if (grid) {
          grid.querySelectorAll(".option-btn").forEach(btn => {
            const txt = btn.querySelector(".option-text");
            if (txt && txt.textContent.trim() === currentWord.meaning) {
              btn.classList.add("correct-choice");
            }
          });
        }

        lastMissedWordId = currentWord.id;

        // Kullanıcı İsteği: Yanlış seçilirse 3D tablo açılır
        setTimeout(() => {
          showTableSection(lastMissedWordId);
        }, 650);
      }
    }

    function showTableSection(highlightId = null) {
      document.getElementById("quizSection").style.display = "none";
      document.getElementById("tableSection").style.display = "flex";
      render24Cards(highlightId);
    }

    function continueQuiz() {
      document.getElementById("tableSection").style.display = "none";
      document.getElementById("quizSection").style.display = "flex";
      currentOrderIndex = (currentOrderIndex + 1) % words.length;
      renderQuestion();
    }

    function toggleTableDirectly() {
      const tableSec = document.getElementById("tableSection");
      if (tableSec && tableSec.style.display !== "none") {
        continueQuiz();
      } else {
        showTableSection(null);
      }
    }

    // 3D FLASHCARD TABLOSU: SAĞDAN SOLA
    // Emsile Modu: 5 satır (5, 5, 4, 5, 5) -> 3. Satırdaki 4 kelime SAĞA YAPIŞIK!
    // Zamir Modu: 5 satır (3, 3, 3, 3, 2) -> Son satırda Ben 1 sütun, Biz 2 sütun (sol + orta) kaplar!
    function render24Cards(highlightId = null) {
      const wrapper = document.getElementById("emsileRowsWrapper");
      if (!wrapper) return;
      wrapper.innerHTML = "";

      if (currentMode === 'emsile') {
        // EMSİLE-İ MUHTELİFE (24 SÎGA: 5, 5, 4, 5, 5)
        const rowDefinitions = [
          { rowNum: 1, count: 5, slice: [0, 5], className: "cols-5" },
          { rowNum: 2, count: 5, slice: [5, 10], className: "cols-5" },
          { rowNum: 3, count: 4, slice: [10, 14], className: "cols-4" }, // Sağa yapışık
          { rowNum: 4, count: 5, slice: [14, 19], className: "cols-5" },
          { rowNum: 5, count: 5, slice: [19, 24], className: "cols-5" }
        ];

        rowDefinitions.forEach(def => {
          const rowItems = words.slice(def.slice[0], def.slice[1]);
          const rowDiv = document.createElement("div");
          rowDiv.className = `emsile-row ${def.className}`;
          rowDiv.setAttribute("data-row", def.rowNum);

          // direction: rtl sayesinde ilk eleman EN SAĞDA yer alır.
          // 4 elemanlı satırda 5. sol hücre boş kalır -> Sağa yapışık olur!
          rowItems.forEach(item => {
            rowDiv.appendChild(createCardElement(item, highlightId));
          });

          wrapper.appendChild(rowDiv);
        });
      } else {
        // ZAMİR TABLOSU (14 ZAMİR: 3, 3, 3, 3, 2)
        const zamirRows = [
          { rowNum: 1, title: "Gâib (3. Şahıs Müzekker)", slice: [0, 3] },
          { rowNum: 2, title: "Gâibe (3. Şahıs Müennes)", slice: [3, 6] },
          { rowNum: 3, title: "Muhâtap (2. Şahıs Müzekker)", slice: [6, 9] },
          { rowNum: 4, title: "Muhâtaba (2. Şahıs Müennes)", slice: [9, 12] }
        ];

        // İlk 4 Satır (3'er sütun)
        zamirRows.forEach(def => {
          const rowItems = words.slice(def.slice[0], def.slice[1]);
          const rowDiv = document.createElement("div");
          rowDiv.className = "emsile-row cols-3";
          rowDiv.setAttribute("data-row", def.rowNum);

          rowItems.forEach(item => {
            rowDiv.appendChild(createCardElement(item, highlightId));
          });

          wrapper.appendChild(rowDiv);
        });

        // 5. Satır: Mütekellim (Sonda 2 Tane: Ben ve Biz)
        // KULLANICI İSTEĞİ: "ben seçeneği sola yapışık. biz seçeneği sol ve ortayı kaplasın"
        const row5Div = document.createElement("div");
        row5Div.className = "emsile-row zamir-row-5";
        row5Div.setAttribute("data-row", 5);

        const itemBen = words[12]; // أَنَا (Ben)
        const itemBiz = words[13]; // نَحْنُ (Biz)

        if (zamirLayout === 'ben_right_biz_left') {
          // Ben: Sağda (1 sütun), Biz: Orta ve Sol (2 sütun kaplar)
          const cardBen = createCardElement(itemBen, highlightId);
          const cardBiz = createCardElement(itemBiz, highlightId, true); // span-2
          row5Div.appendChild(cardBen);
          row5Div.appendChild(cardBiz);
        } else {
          // Ben: Solda yapışık (1 sütun), Biz: Sağ ve Orta (2 sütun kaplar)
          const cardBiz = createCardElement(itemBiz, highlightId, true); // span-2
          const cardBen = createCardElement(itemBen, highlightId);
          row5Div.appendChild(cardBiz);
          row5Div.appendChild(cardBen);
        }

        wrapper.appendChild(row5Div);
      }

      if (highlightId) {
        setTimeout(() => {
          const el = wrapper.querySelector(`.flip-card[data-id="${highlightId}"]`);
          if (el && typeof el.scrollIntoView === 'function') {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 150);
      }
    }

    function createCardElement(item, highlightId = null, isSpan2 = false) {
      const isMissed = (highlightId && item.id === highlightId);
      const card = document.createElement("div");
      card.className = `flip-card ${isSpan2 ? "card-span-2" : ""} ${isMissed ? "missed-highlight" : ""}`;
      card.setAttribute("data-id", item.id);

      card.innerHTML = `
        <div class="flip-card-inner">
          <!-- Ön Yüz: Arapça Kelime (Sağdan Sola) -->
          <div class="flip-card-front">
            <span class="card-id-tag">${item.id}</span>
            <div class="card-word-text">${item.word}</div>
            <div class="card-flip-hint">🔄 Anlamı</div>
          </div>
          <!-- Arka Yüz: Türkçe Karşılığı -->
          <div class="flip-card-back">
            <div class="card-meaning-text">${escapeHtml(item.meaning)}</div>
            <span class="card-meaning-tag">ANLAMI ✓</span>
          </div>
        </div>
      `;

      card.addEventListener("click", () => {
        card.classList.toggle("flipped");
        playSound('flip');
        if (navigator.vibrate) navigator.vibrate(25);
      });

      return card;
    }

    // 5. KELİMELERİ DÜZENLE MODALI
    function openEditWordsModal() {
      const container = document.getElementById("editWordsListContainer");
      if (!container) return;
      container.innerHTML = "";

      const titleEl = document.querySelector("#editWordsModal .modal-header h3");
      if (titleEl) {
        titleEl.textContent = (currentMode === 'emsile')
          ? "✏️ 24 Emsile Kelimesini Düzenle"
          : "✏️ 14 Zamir Kelimesini Düzenle";
      }

      words.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "word-edit-row";
        row.innerHTML = `
          <span class="word-edit-num">${idx + 1}.</span>
          <input type="text" class="word-edit-input arabic-input" id="editWord_${idx}" value="${escapeHtml(item.word)}" placeholder="Arapça" />
          <input type="text" class="word-edit-input" id="editMeaning_${idx}" value="${escapeHtml(item.meaning)}" placeholder="Anlamı" />
        `;
        container.appendChild(row);
      });

      document.getElementById("editWordsModal").style.display = "flex";
    }

    function closeEditWordsModal() {
      document.getElementById("editWordsModal").style.display = "none";
    }

    function saveEditedWords() {
      const updated = [];
      const defaultList = (currentMode === 'emsile' ? EMSILE_24_WORDS : ZAMIR_14_WORDS);

      for (let i = 0; i < words.length; i++) {
        const wInput = document.getElementById(`editWord_${i}`);
        const mInput = document.getElementById(`editMeaning_${i}`);
        const wVal = (wInput ? wInput.value : "").trim() || defaultList[i].word;
        const mVal = (mInput ? mInput.value : "").trim() || defaultList[i].meaning;
        updated.push({ id: i + 1, word: wVal, meaning: mVal });
      }

      if (currentMode === 'emsile') {
        emsileWords = updated;
        words = emsileWords;
        try {
          localStorage.setItem("sinirlayici_custom_lang_words_v4", JSON.stringify(updated));
        } catch(e) {}
      } else {
        zamirWords = updated;
        words = zamirWords;
        try {
          localStorage.setItem("sinirlayici_custom_zamir_words_v1", JSON.stringify(updated));
        } catch(e) {}
      }

      closeEditWordsModal();
      initShuffledIndices();
      renderQuestion();
      showToast("✅ Kelimeler başarıyla kaydedildi!");
    }

    // 6. YARDIMCI FONKSİYONLAR
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toastMessage");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove("show");
      }, 2400);
    }

    // Başlangıç
    window.addEventListener("DOMContentLoaded", () => {
      loadCustomWords();
      initShuffledIndices();
      renderQuestion();
    });
  </script>
</body>
</html>
