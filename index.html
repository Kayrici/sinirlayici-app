<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hatırlatıcı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core/style.css">
</head>
<body>
  <div id="app" class="mobile-viewport">
    <!-- Üst Mobil Bar (Header) -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-logo" title="Hatırlatıcı">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="clock-silhouette">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15 14"></polyline>
          </svg>
        </div>
        <div class="header-titles">
          <h1 id="appHeaderTitle">Hatırlatıcı</h1>
        </div>
      </div>
      <div class="header-right" style="display: flex; align-items: center; gap: 0.5rem;">
        <button id="btnHeaderPermAlert" onclick="window.__openAccessibilitySettings()" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; padding: 0.35rem 0.65rem; border-radius: 999px; font-size: 0.72rem; font-weight: 800; cursor: pointer;">
          ⚠️ İzin Ver
        </button>
        <button id="btnHeaderSettings" class="btn-gear" onclick="window.kernel.openSettings()" title="Ayarlar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="gear-icon">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Dinamik Modül Görüntüleme Alanı (Genişletilmiş Sayfa) -->
    <main id="moduleContainer" class="module-container">
      <!-- Modüller buraya izole olarak yüklenir -->
    </main>

    <!-- Alt Menü Sekmeleri (Mobil Standart Alt Navigasyon Barı) -->
    <nav class="app-bottom-nav">
      <div id="navItemsContainer" class="bottom-nav-wrapper">
        <!-- Menü isimleri burada yer alır -->
      </div>
    </nav>

    <!-- Ayarlar Ekranı (Şimdilik Boş ve Sade) -->
    <section id="settingsView" class="settings-modal" style="display: none;">
      <div class="settings-header">
        <button class="btn-back" onclick="window.kernel.closeSettings()">←</button>
        <h2>Ayarlar</h2>
        <div style="width: 32px;"></div>
      </div>
      <div class="settings-content">
        <!-- Ayarlar Listesi -->
        <div id="settingsMainList">
          <div class="settings-item" onclick="window.kernel.openProfile()">
            <div class="settings-item-left">
              <span class="settings-item-icon">👤</span>
              <div>
                <div class="settings-item-title">Profil</div>
                <div id="profileUsernameDisplay" class="settings-item-subtitle">Kullanıcı adı belirlenmedi</div>
              </div>
            </div>
            <span class="settings-item-arrow">→</span>
          </div>
          <div class="settings-item" onclick="if(window.AndroidBridge)window.AndroidBridge.openAccessibilitySettings()">
            <div class="settings-item-left">
              <span class="settings-item-icon">🛡️</span>
              <div>
                <div class="settings-item-title">Erişilebilirlik İzni</div>
                <div class="settings-item-subtitle">Süre bitiminde uygulamayı kapatma yetkisi</div>
              </div>
            </div>
            <span class="settings-item-arrow">→</span>
          </div>
        </div>

        <!-- Profil Düzenleme Alt Ekranı -->
        <div id="profileSubView" style="display: none; flex-direction: column; gap: 1rem;">
          <div class="card-panel" style="margin-bottom: 0;">
            <label style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.6rem;">
              Kullanıcı Adı
            </label>
            <input type="text" id="usernameInput" placeholder="Kullanıcı adınızı girin..."
              style="width: 100%; padding: 0.8rem 1rem; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-card); color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 1rem;">
            <div style="display: flex; gap: 0.5rem;">
              <button onclick="window.kernel.closeProfile()" 
                style="flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border-card); color: var(--text-secondary); padding: 0.75rem; border-radius: 12px; font-weight: 600; cursor: pointer;">
                İptal
              </button>
              <button onclick="window.kernel.saveUsername()" 
                style="flex: 1; background: var(--accent-primary); border: none; color: #fff; padding: 0.75rem; border-radius: 12px; font-weight: 700; cursor: pointer;">
                Kaydet
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Çekirdek Sistem ve Modüller (Doğrudan Sıralı Yükleme) -->
  <script src="core/kernel.js"></script>
  <script src="modules/hatirlatici/index.js"></script>
  <script src="modules/sinirlayici/index.js"></script>
</body>
</html>
