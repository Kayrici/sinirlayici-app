<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arapça Hikaye Okuma ve Kelime Tahlili</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: rgba(26, 34, 53, 0.78);
      --bg-card-hover: rgba(35, 46, 70, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-primary: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --accent-success: #10b981;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-arabic: 'Noto Naskh Arabic', 'Amiri', 'Traditional Arabic', serif;
      --arabic-font-size: 2.15rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Üst Bar */
    header.story-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .header-title-box h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .header-title-box p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-font-size {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-font-size:hover {
      background: rgba(99, 102, 241, 0.3);
      border-color: #6366f1;
    }

    .btn-toggle-tr {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-toggle-tr:hover {
      background: rgba(99, 102, 241, 0.3);
      color: #fff;
    }

    /* Ana Alan */
    .story-container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 140px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Sayfa Seçici Menüsü */
    .page-nav-wrapper {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .page-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .page-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.3) transparent;
    }

    .page-chips::-webkit-scrollbar {
      height: 4px;
    }
    .page-chips::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 4px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: #fff;
    }

    .chip-btn.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: #818cf8;
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.45);
    }

    /* Sayfa Başlık Bandı */
    .page-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.95));
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-primary);
      border-radius: 14px;
      padding: 12px 18px;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    .page-section-title-ar {
      font-family: var(--font-arabic);
      font-size: 1.45rem;
      font-weight: 700;
      color: #fbbf24;
      direction: rtl;
    }

    .page-section-meta {
      font-size: 0.82rem;
      font-weight: 700;
      color: #94a3b8;
    }

    /* Hikaye Paragraf Kartları */
    .story-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 22px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.2s ease;
      margin-bottom: 14px;
    }

    .story-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
    }

    .arabic-text-box {
      direction: rtl;
      text-align: right;
      font-family: var(--font-arabic);
      font-size: var(--arabic-font-size);
      line-height: 2.3;
      color: #ffffff;
      letter-spacing: 0.3px;
      user-select: text;
    }

    /* Kelime Tıklama Butonları */
    .ar-word {
      display: inline-block;
      cursor: pointer;
      padding: 2px 6px;
      margin: 0 2px;
      border-radius: 7px;
      transition: all 0.18s ease;
      position: relative;
    }

    .ar-word:hover {
      background: rgba(99, 102, 241, 0.32);
      color: #c7d2fe;
      transform: translateY(-1px);
    }

    .ar-word.selected {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(168, 85, 247, 0.45));
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.55);
      border-bottom: 2px solid #a5b4fc;
    }

    /* Cümle Çeviri Alanı */
    .sentence-tr-box {
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      padding-top: 12px;
      font-size: 0.92rem;
      line-height: 1.55;
      color: #cbd5e1;
      font-style: italic;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .sentence-tr-box .tr-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-style: normal;
    }

    /* Alt Sayfa Geçiş Butonları */
    .page-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding: 14px 4px;
    }

    .btn-page-step {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-page-step:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.3);
      border-color: #6366f1;
      transform: translateY(-1px);
    }

    .btn-page-step:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ALT SABİT KELİME ÇÖZÜMLEME DOCK'U */
    .word-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      width: calc(100% - 32px);
      max-width: 800px;
      background: rgba(15, 23, 42, 0.97);
      border: 1.5px solid rgba(99, 102, 241, 0.55);
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      padding: 18px 22px;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .word-dock.active {
      transform: translateX(-50%) translateY(0);
    }

    .dock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .dock-left-box {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .dock-word-ar {
      font-family: var(--font-arabic);
      font-size: 2.1rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .dock-root-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .dock-root-badge .root-ar {
      font-family: var(--font-arabic);
      font-size: 1.35rem;
      font-weight: 800;
    }

    .dock-type-badge {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .dock-close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      line-height: 1;
      transition: all 0.2s;
    }

    .dock-close-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .dock-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dock-phrase-tr {
      font-size: 1.15rem;
      color: #f8fafc;
      font-weight: 600;
      line-height: 1.5;
    }

    /* Kullanıcının istediği altı çizili tamlama vurgusu */
    .dock-phrase-tr u {
      color: #38bdf8;
      text-decoration-color: #38bdf8;
      text-decoration-thickness: 3px;
      text-underline-offset: 5px;
      font-weight: 800;
    }

    .dock-meta {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      line-height: 1.4;
    }

    .dock-meta em {
      font-family: var(--font-arabic);
      font-style: normal;
      color: #e2e8f0;
      direction: rtl;
    }

    /* Mobil Uyumluluk */
    @media (max-width: 600px) {
      :root {
        --arabic-font-size: 1.8rem;
      }
      .story-card {
        padding: 16px 14px;
      }
      .dock-word-ar {
        font-size: 1.7rem;
      }
      .word-dock {
        bottom: 10px;
        padding: 14px 16px;
        width: calc(100% - 20px);
      }
      .dock-phrase-tr {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="story-header">
    <div class="header-left">
      <button type="button" class="btn-nav" onclick="goBack()" title="Geri Dön">
        ⬅️ Çıkış
      </button>
      <div class="header-title-box">
        <h1>Arapça Hikaye Okuma</h1>
        <p>Modern Dijital Nesih & Kelime Tahlili</p>
      </div>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-font-size" onclick="adjustFontSize(-0.15)" title="Yazıyı Küçült">A-</button>
      <button type="button" class="btn-font-size" onclick="adjustFontSize(0.15)" title="Yazıyı Büyüt">A+</button>
      <button type="button" class="btn-toggle-tr" id="btnToggleTr" onclick="toggleAllTranslations()">
        📖 Çeviriyi Gizle
      </button>
    </div>
  </header>

  <!-- ANA İÇERİK -->
  <div class="story-container">
    
    <!-- SAYFA SEÇİCİ -->
    <div class="page-nav-wrapper">
      <div class="page-nav-header">
        <span>📖 SAYFA SEÇİN:</span>
        <span id="currentPageIndicator">Sayfa 1 / 10</span>
      </div>
      <div class="page-chips" id="pageChipsContainer">
        <!-- JS ile sayfa butonları üretilir -->
      </div>
    </div>

    <!-- HİKAYE CÜMLELERİ ALANI -->
    <div id="storyContentArea">
      <!-- Cümle kartları burada render edilir -->
    </div>

    <!-- ALT SAYFA GEÇİŞİ -->
    <div class="page-footer-nav" id="pageFooterNav">
      <button type="button" class="btn-page-step" id="btnPrevPage" onclick="changePage(-1)">
        ⬅️ Önceki Sayfa
      </button>
      <button type="button" class="btn-page-step" id="btnNextPage" onclick="changePage(1)">
        Sonraki Sayfa ➡️
      </button>
    </div>

  </div>

  <!-- ALT KELİME ÇÖZÜMLEME DOCK'U -->
  <div class="word-dock" id="wordDock">
    <div class="dock-header">
      <div class="dock-left-box">
        <div class="dock-word-ar" id="dockWordAr">الكَبِيرَةِ</div>
        <div class="dock-root-badge" id="dockRootBadge">
          <span class="root-ar" id="dockRootAr">كَبِير</span>
          <span class="root-tag">(kök)</span>
        </div>
        <div class="dock-type-badge" id="dockTypeBadge">Sıfat</div>
      </div>
      <button type="button" class="dock-close-btn" onclick="closeWordDock()" title="Kapat">✕</button>
    </div>

    <div class="dock-body">
      <div class="dock-phrase-tr" id="dockPhraseTr">
        <u>Büyük</u> Kaya Şehri'nde
      </div>
      <div class="dock-meta" id="dockMeta">
        <span id="dockFullSentence">📍 Cümle: "فِي مَدِينَةِ الصَّخْرِ الكَبِيرَةِ."</span>
      </div>
    </div>
  </div>

  <!-- HİKAYE VERİ SETİ (10 SAYFA, KÖKLER, ANLAMLAR) -->
  <script src="hikaye_data.js"></script>

  <script>
    let activePageNumber = 1; // 1 to 10, or 'all'
    let currentFontSizeRem = 2.15;
    let areTranslationsVisible = true;
    let selectedWordId = null;

    // Sayfa navigasyon butonlarını oluştur
    function renderPageChips() {
      const container = document.getElementById("pageChipsContainer");
      if (!container || typeof STORY_PAGES === "undefined") return;
      container.innerHTML = "";

      STORY_PAGES.forEach((page) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `chip-btn ${activePageNumber === page.pageNum ? "active" : ""}`;
        btn.textContent = `Sayfa ${page.pageNum}`;
        btn.addEventListener("click", () => switchPage(page.pageNum));
        container.appendChild(btn);
      });

      // 'Tüm Hikaye' butonu
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = `chip-btn ${activePageNumber === 'all' ? "active" : ""}`;
      allBtn.textContent = `📚 Tüm Hikaye (1-10)`;
      allBtn.addEventListener("click", () => switchPage('all'));
      container.appendChild(allBtn);
    }

    // Sayfa değiştirme fonksiyonu
    function switchPage(target) {
      activePageNumber = target;
      renderPageChips();
      renderStory();
      updatePageFooterNav();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function changePage(delta) {
      if (activePageNumber === 'all') {
        switchPage(1);
        return;
      }
      const newPage = activePageNumber + delta;
      if (newPage >= 1 && newPage <= (STORY_PAGES ? STORY_PAGES.length : 10)) {
        switchPage(newPage);
      }
    }

    function updatePageFooterNav() {
      const indicator = document.getElementById("currentPageIndicator");
      const prevBtn = document.getElementById("btnPrevPage");
      const nextBtn = document.getElementById("btnNextPage");
      const total = STORY_PAGES ? STORY_PAGES.length : 10;

      if (indicator) {
        indicator.textContent = activePageNumber === 'all' ? `Tüm Hikaye (1 - ${total})` : `Sayfa ${activePageNumber} / ${total}`;
      }

      if (prevBtn) {
        prevBtn.disabled = (activePageNumber === 1 || activePageNumber === 'all');
      }
      if (nextBtn) {
        nextBtn.disabled = (activePageNumber === total || activePageNumber === 'all');
      }
    }

    // Hikaye İçeriğini Render Et
    function renderStory() {
      const area = document.getElementById("storyContentArea");
      if (!area || typeof STORY_PAGES === "undefined") return;
      area.innerHTML = "";

      const pagesToRender = activePageNumber === 'all'
        ? STORY_PAGES
        : STORY_PAGES.filter(p => p.pageNum === activePageNumber);

      pagesToRender.forEach((page) => {
        // Sayfa Başlığı Bandı
        const pageHeader = document.createElement("div");
        pageHeader.className = "page-section-header";
        pageHeader.innerHTML = `
          <div class="page-section-title-ar">${page.title}</div>
          <div class="page-section-meta">Bölüm ${page.pageNum}</div>
        `;
        area.appendChild(pageHeader);

        // Sayfadaki Cümleler
        page.sentences.forEach((sentence) => {
          const card = document.createElement("div");
          card.className = "story-card";
          card.id = `sentenceCard_${sentence.id}`;

          // Arapça Metin Alanı
          const arBox = document.createElement("div");
          arBox.className = "arabic-text-box";

          sentence.words.forEach((w) => {
            const wSpan = document.createElement("span");
            wSpan.className = "ar-word";
            wSpan.id = `word_${w.id}`;
            wSpan.textContent = w.ar;
            wSpan.title = "Kök ve tamlama manası için tıklayın";
            wSpan.addEventListener("click", () => selectWord(sentence, w));
            arBox.appendChild(wSpan);
            arBox.appendChild(document.createTextNode(" "));
          });

          card.appendChild(arBox);

          // Türkçe Çeviri Alanı
          const trBox = document.createElement("div");
          trBox.className = "sentence-tr-box";
          trBox.id = `sentenceTr_${sentence.id}`;
          trBox.style.display = areTranslationsVisible ? "flex" : "none";
          trBox.innerHTML = `
            <span class="tr-label">TÜRKÇE ANLAMI:</span>
            <span>${sentence.fullTurkish}</span>
          `;

          card.appendChild(trBox);
          area.appendChild(card);
        });
      });
    }

    // Kelime Seçme ve Alt Paneli Açma
    function selectWord(sentence, word) {
      selectedWordId = word.id;

      // Önceki seçili kelimelerden vurguyu kaldır
      document.querySelectorAll(".ar-word").forEach(el => el.classList.remove("selected"));

      // Yeni kelimeyi vurgula
      const el = document.getElementById(`word_${word.id}`);
      if (el) el.classList.add("selected");

      // Dock alanını doldur
      const dock = document.getElementById("wordDock");
      const wordAr = document.getElementById("dockWordAr");
      const rootAr = document.getElementById("dockRootAr");
      const phraseTr = document.getElementById("dockPhraseTr");
      const typeBadge = document.getElementById("dockTypeBadge");
      const fullSentence = document.getElementById("dockFullSentence");

      if (wordAr) wordAr.textContent = word.ar;
      if (rootAr) rootAr.textContent = word.root ? word.root : "—";
      if (typeBadge) typeBadge.textContent = word.type || "Kelime";
      if (phraseTr) phraseTr.innerHTML = word.phraseTr || word.meaning;
      if (fullSentence) {
        fullSentence.innerHTML = `📍 Cümle: <em>"${sentence.fullArabic}"</em> — ${sentence.fullTurkish}`;
      }

      if (dock) {
        dock.classList.add("active");
      }
    }

    function closeWordDock() {
      const dock = document.getElementById("wordDock");
      if (dock) dock.classList.remove("active");
      document.querySelectorAll(".ar-word").forEach(el => el.classList.remove("selected"));
      selectedWordId = null;
    }

    function toggleAllTranslations() {
      areTranslationsVisible = !areTranslationsVisible;
      const btn = document.getElementById("btnToggleTr");
      if (btn) {
        btn.textContent = areTranslationsVisible ? "📖 Çeviriyi Gizle" : "📖 Çeviriyi Göster";
      }
      document.querySelectorAll(".sentence-tr-box").forEach(el => {
        el.style.display = areTranslationsVisible ? "flex" : "none";
      });
    }

    function adjustFontSize(delta) {
      currentFontSizeRem = Math.max(1.4, Math.min(3.2, currentFontSizeRem + delta));
      document.documentElement.style.setProperty('--arabic-font-size', `${currentFontSizeRem}rem`);
    }

    function goBack() {
      if (window.parent && window.parent !== window && typeof window.parent.closeHikayeModal === 'function') {
        window.parent.closeHikayeModal();
      } else {
        window.location.href = "index.html";
      }
    }

    // Sayfa Yüklendiğinde Başlat
    window.addEventListener("DOMContentLoaded", () => {
      renderPageChips();
      renderStory();
      updatePageFooterNav();

      // İlk kelimeyi kullanıcıya örnek olarak seçili göster
      if (typeof STORY_PAGES !== "undefined" && STORY_PAGES[0] && STORY_PAGES[0].sentences[0]) {
        const firstSent = STORY_PAGES[0].sentences[0];
        if (firstSent.words[0]) {
          selectWord(firstSent, firstSent.words[0]);
        }
      }
    });
  </script>
</body>
</html>
